name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      - name: Check the install script
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          bash -n packaging/root/usr/sbin/amadeos-install
          shellcheck --severity=warning packaging/root/usr/sbin/amadeos-install scripts/*.sh
          packaging/root/usr/sbin/amadeos-install --help >/dev/null
      # The Swing tests skip themselves without a display, so run under Xvfb.
      - name: Test
        run: xvfb-run --auto-servernum ./gradlew test --no-daemon
      - name: Package
        run: ./gradlew deb --no-daemon && sudo apt-get install -y lintian && lintian --no-tag-display-limit build/distributions/*.deb || true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
