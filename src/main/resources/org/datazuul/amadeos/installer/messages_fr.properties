language.intro=Bienvenue dans amadeOS.\n\nCet assistant installe le système live en cours d'exécution sur un disque de cet ordinateur. Il demande la langue, le clavier, le fuseau horaire, le disque cible et le premier utilisateur. Rien n'est écrit sur le disque avant que vous ayez confirmé le résumé.
language.label=&Langue :
language.not-live=Ceci ne semble pas être le système live amadeOS. L'installation ne démarrera pas ici.

keyboard.intro=Choisissez la disposition du clavier du système installé. La disposition choisie est activée immédiatement ; vous pouvez l'essayer dans le champ ci-dessous.
keyboard.variant=&Variante (facultative, p. ex. nodeadkeys) :
keyboard.try=&Essayez le clavier ici :
keyboard.problem.none=Choisissez une disposition de clavier.
keyboard.problem.variant=La variante ne peut contenir que des lettres, des chiffres, _ et -.

timezone.intro=Choisissez le fuseau horaire de l'ordinateur. Tapez une partie du nom d'une ville ou d'une région pour raccourcir la liste.
timezone.filter=&Rechercher :
timezone.problem.none=Choisissez un fuseau horaire.

disk.intro=Où installer amadeOS ? Le support à partir duquel le système live fonctionne n'est pas proposé.
disk.firmware.uefi=Cet ordinateur a démarré en UEFI ; le chargeur d'amorçage UEFI sera installé.
disk.firmware.bios=Cet ordinateur a démarré en mode BIOS ; le chargeur d'amorçage BIOS sera installé.
disk.whole=&Effacer un disque entier et y installer amadeOS
disk.whole.detail=Le disque reçoit une nouvelle table de partitions avec une partition système EFI, la partition amadeOS et, si vous le choisissez, une partition d'échange. Tout ce qui se trouve sur le disque est perdu.
disk.disk=&Disque :
disk.swap=Partition d'é&change :
disk.swap.none=Aucune
disk.partition=Installer dans une partition e&xistante
disk.partition.detail=Seule cette partition est formatée ; les autres restent telles quelles. Créez d'abord la partition avec un outil de partitionnement.
disk.root=Pa&rtition :
disk.efi=Partition système EFI :
disk.efi.auto=Automatique (la première du disque)
disk.refresh=Act&ualiser
disk.loading=Recherche des disques…
disk.none=Aucun disque sur lequel amadeOS pourrait être installé n'a été trouvé. Un disque doit faire au moins {0} et ne pas être monté.
disk.error=Les disques n'ont pas pu être listés : {0}
disk.problem.none=Choisissez un disque.
disk.problem.partition=Choisissez une partition.

user.intro=Le premier utilisateur du système installé. Cet utilisateur administre l'ordinateur (sudo) ; il n'y a pas de mot de passe root séparé.
user.fullname=&Nom complet :
user.username=Nom d'&utilisateur :
user.password=&Mot de passe :
user.repeat=Répé&ter le mot de passe :
user.show=A&fficher les mots de passe
user.hostname=Nom de l'&ordinateur :
user.problem.fullname=Le nom complet ne peut pas contenir : , ou =
user.problem.username=Le nom d'utilisateur se compose de lettres minuscules, de chiffres, de _ et de -, commence par une lettre et compte au plus 32 caractères.
user.problem.username.root=root ne peut pas être le nom d'utilisateur.
user.problem.password=Saisissez un mot de passe.
user.problem.password.short=Le mot de passe doit avoir au moins {0} caractères.
user.problem.repeat=Les deux mots de passe sont différents.
user.problem.hostname=Le nom de l'ordinateur se compose de lettres minuscules, de chiffres et de tirets (1 à 63 caractères).

