finish.intro=amadeOS ist auf {0} installiert.\n\nEntfernen Sie das Live-Medium (USB-Stick oder DVD) und starten Sie den Computer neu, um das installierte System zu starten, oder schließen Sie dieses Fenster und arbeiten Sie vorerst mit dem Live-System weiter.
