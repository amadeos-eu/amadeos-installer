language.intro=Willkommen bei amadeOS.\n\nDieser Assistent installiert das laufende Live-System auf eine Festplatte dieses Computers. Er fragt nach Sprache, Tastatur, Zeitzone, Zielfestplatte und dem ersten Benutzer. Auf die Festplatte wird erst geschrieben, wenn Sie die Zusammenfassung bestätigt haben.
language.label=&Sprache:
language.not-live=Dies scheint nicht das amadeOS-Live-System zu sein. Die Installation wird hier nicht starten.

keyboard.intro=Wählen Sie die Tastaturbelegung des installierten Systems. Die gewählte Belegung ist sofort aktiv, Sie können sie im Feld unten ausprobieren.
keyboard.variant=&Variante (optional, z. B. nodeadkeys):
keyboard.try=&Tastatur hier ausprobieren:
keyboard.problem.none=Wählen Sie eine Tastaturbelegung.
keyboard.problem.variant=Die Variante darf nur Buchstaben, Ziffern, _ und - enthalten.

timezone.intro=Wählen Sie die Zeitzone des Computers. Tippen Sie einen Teil eines Stadt- oder Regionsnamens, um die Liste zu verkürzen.
timezone.filter=&Suchen:
timezone.problem.none=Wählen Sie eine Zeitzone.

disk.intro=Wohin soll amadeOS installiert werden? Das Medium, von dem das Live-System läuft, wird nicht angeboten.
disk.firmware.uefi=Dieser Computer hat mit UEFI gestartet; der UEFI-Bootloader wird installiert.
disk.firmware.bios=Dieser Computer hat im BIOS-Modus gestartet; der BIOS-Bootloader wird installiert.
disk.whole=&Ganze Festplatte löschen und amadeOS darauf installieren
disk.whole.detail=Die Festplatte erhält eine neue Partitionstabelle mit einer EFI-Systempartition, der amadeOS-Partition und, falls gewählt, einer Swap-Partition. Alles auf der Festplatte geht verloren.
disk.disk=&Festplatte:
disk.swap=Swap-Partiti&on:
disk.swap.none=Keine
disk.partition=In eine &vorhandene Partition installieren
disk.partition.detail=Nur diese Partition wird formatiert; die anderen bleiben, wie sie sind. Legen Sie die Partition vorher mit einem Partitionierungswerkzeug an.
disk.root=&Partition:
disk.efi=EFI-Systempartition:
disk.efi.auto=Automatisch (die erste auf der Festplatte)
disk.refresh=Akt&ualisieren
disk.loading=Festplatten werden gesucht…
disk.none=Es wurde keine Festplatte gefunden, auf die amadeOS installiert werden könnte. Eine Festplatte braucht mindestens {0} und darf nicht eingebunden sein.
disk.error=Die Festplatten konnten nicht aufgelistet werden: {0}
disk.problem.none=Wählen Sie eine Festplatte.
disk.problem.partition=Wählen Sie eine Partition.

user.intro=Der erste Benutzer des installierten Systems. Dieser Benutzer verwaltet den Computer (sudo); ein eigenes root-Passwort gibt es nicht.
user.fullname=&Vollständiger Name:
user.username=&Benutzername:
user.password=&Passwort:
user.repeat=Passwort wieder&holen:
user.show=Passwörter anzei&gen
user.hostname=Computer&name:
user.problem.fullname=Der vollständige Name darf nicht : , oder = enthalten.
user.problem.username=Der Benutzername besteht aus Kleinbuchstaben, Ziffern, _ und -, beginnt mit einem Buchstaben und hat höchstens 32 Zeichen.
user.problem.username.root=root kann nicht der Benutzername sein.
user.problem.password=Geben Sie ein Passwort ein.
user.problem.password.short=Das Passwort braucht mindestens {0} Zeichen.
user.problem.repeat=Die beiden Passwörter sind verschieden.
user.problem.hostname=Der Computername besteht aus Kleinbuchstaben, Ziffern und Bindestrichen (1 bis 63 Zeichen).

