language.intro=Bienvenido a amadeOS.\n\nEste asistente instala el sistema en vivo que está ejecutando en un disco de este equipo. Pregunta por el idioma, el teclado, la zona horaria, el disco de destino y el primer usuario. No se escribe nada en el disco hasta que confirme el resumen.
language.label=&Idioma:
language.not-live=Esto no parece ser el sistema en vivo de amadeOS. La instalación no se iniciará aquí.

keyboard.intro=Elija la distribución de teclado del sistema instalado. La distribución elegida se activa de inmediato; puede probarla en el campo de abajo.
keyboard.variant=&Variante (opcional, p. ej. nodeadkeys):
keyboard.try=&Pruebe el teclado aquí:
keyboard.problem.none=Elija una distribución de teclado.
keyboard.problem.variant=La variante solo puede contener letras, dígitos, _ y -.

timezone.intro=Elija la zona horaria del equipo. Escriba parte del nombre de una ciudad o región para acortar la lista.
timezone.filter=&Buscar:
timezone.problem.none=Elija una zona horaria.

disk.intro=¿Dónde se debe instalar amadeOS? El medio desde el que se ejecuta el sistema en vivo no se ofrece.
disk.firmware.uefi=Este equipo arrancó con UEFI; se instalará el cargador de arranque UEFI.
disk.firmware.bios=Este equipo arrancó en modo BIOS; se instalará el cargador de arranque BIOS.
disk.whole=&Borrar un disco entero e instalar amadeOS en él
disk.whole.detail=El disco recibe una nueva tabla de particiones con una partición de sistema EFI, la partición de amadeOS y, si se elige, una partición de intercambio. Todo lo que hay en el disco se pierde.
disk.disk=&Disco:
disk.swap=Partición de &intercambio:
disk.swap.none=Ninguna
disk.partition=Instalar en una partición e&xistente
disk.partition.detail=Solo se formatea esa partición; las demás quedan como están. Cree la partición antes con una herramienta de particionado.
disk.root=&Partición:
disk.efi=Partición de sistema EFI:
disk.efi.auto=Automática (la primera del disco)
disk.refresh=Actuali&zar
disk.loading=Buscando discos…
disk.none=No se encontró ningún disco en el que se pueda instalar amadeOS. Un disco necesita al menos {0} y no debe estar montado.
disk.error=No se pudieron listar los discos: {0}
disk.problem.none=Elija un disco.
disk.problem.partition=Elija una partición.

user.intro=El primer usuario del sistema instalado. Este usuario administra el equipo (sudo); no hay una contraseña de root separada.
user.fullname=Nombre c&ompleto:
