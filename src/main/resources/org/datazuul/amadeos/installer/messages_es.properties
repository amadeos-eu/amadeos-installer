user.problem.fullname=El nombre completo no puede contener : , ni =
user.problem.username=El nombre de usuario se compone de letras minúsculas, dígitos, _ y -, empieza por una letra y tiene como máximo 32 caracteres.
user.problem.username.root=root no puede ser el nombre de usuario.
user.problem.password=Introduzca una contraseña.
user.problem.password.short=La contraseña necesita al menos {0} caracteres.
user.problem.repeat=Las dos contraseñas son distintas.
user.problem.hostname=El nombre del equipo se compone de letras minúsculas, dígitos y guiones (de 1 a 63 caracteres).

