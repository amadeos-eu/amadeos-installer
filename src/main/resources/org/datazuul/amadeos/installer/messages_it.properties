language.intro=Benvenuti in amadeOS.\n\nQuesto assistente installa il sistema live in esecuzione su un disco di questo computer. Chiede la lingua, la tastiera, il fuso orario, il disco di destinazione e il primo utente. Sul disco non viene scritto nulla prima della conferma del riepilogo.
language.label=&Lingua:
language.not-live=Questo non sembra essere il sistema live amadeOS. L'installazione non partirà qui.

keyboard.intro=Scegliere la disposizione della tastiera del sistema installato. La disposizione scelta è attiva subito; la si può provare nel campo sottostante.
keyboard.variant=&Variante (facoltativa, ad es. nodeadkeys):
keyboard.try=&Provare la tastiera qui:
keyboard.problem.none=Scegliere una disposizione della tastiera.
keyboard.problem.variant=La variante può contenere solo lettere, cifre, _ e -.

timezone.intro=Scegliere il fuso orario del computer. Digitare parte del nome di una città o regione per accorciare l'elenco.
timezone.filter=&Cerca:
timezone.problem.none=Scegliere un fuso orario.

disk.intro=Dove installare amadeOS? Il supporto da cui è in esecuzione il sistema live non viene offerto.
disk.firmware.uefi=Questo computer è stato avviato con UEFI; sarà installato il boot loader UEFI.
disk.firmware.bios=Questo computer è stato avviato in modalità BIOS; sarà installato il boot loader BIOS.
disk.whole=&Cancellare un intero disco e installarvi amadeOS
disk.whole.detail=Il disco riceve una nuova tabella delle partizioni con una partizione di sistema EFI, la partizione amadeOS e, se scelta, una partizione di swap. Tutto ciò che si trova sul disco va perduto.
