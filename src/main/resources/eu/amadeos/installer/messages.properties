language.intro=Welcome to amadeOS.\n\nThis assistant installs the live system you are running onto a disk of this computer. It asks for the language, the keyboard, the time zone, the target disk and the first user. Nothing is written to the disk before you confirm the summary.
language.label=&Language:
language.not-live=This does not seem to be the amadeOS live system. The installation will not start here.

keyboard.intro=Choose the keyboard layout of the installed system. The chosen layout is switched on right away, so you can try it in the field below.
keyboard.variant=&Variant (optional, e.g. nodeadkeys):
keyboard.try=&Try the keyboard here:
keyboard.problem.none=Choose a keyboard layout.
keyboard.problem.variant=The variant may only contain letters, digits, _ and -.

timezone.intro=Choose the time zone of the computer. Type a part of a city or region name to shorten the list.
timezone.filter=&Find:
timezone.problem.none=Choose a time zone.

disk.intro=Where should amadeOS be installed? The medium the live system runs from is not offered.
disk.firmware.uefi=This computer booted with UEFI; the UEFI boot loader will be installed.
disk.firmware.bios=This computer booted in BIOS mode; the BIOS boot loader will be installed.
disk.whole=&Erase a whole disk and install amadeOS on it
disk.whole.detail=The disk gets a new partition table with an EFI System Partition, the amadeOS partition and, if chosen, a swap partition. Everything on the disk is lost.
